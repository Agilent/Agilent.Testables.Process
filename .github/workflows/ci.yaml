name: Continuous Integration
on:
    push:
        branches:
        - '**'
jobs:
    build:
        runs-on: windows-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - name: Build
              working-directory: ./src
              run: dotnet build
            - name: Test
              working-directory: ./src
              run: dotnet test --no-build